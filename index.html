<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Background Remover - Tách Nền Ảnh Trực Tiếp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #a855f7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header { text-align: center; max-width: 650px; margin-bottom: 30px; }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 15px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }

    .upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.4);
      transition: border-color 0.2s;
    }
    .upload-box:hover { border-color: var(--primary); }

    .upload-icon { width: 56px; height: 56px; margin-bottom: 15px; fill: var(--primary); }

    .fake-btn {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      margin-top: 15px;
      display: inline-block;
      pointer-events: none;
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      text-align: left;
      white-space: pre-wrap;
    }

    .loading-state { display: none; text-align: center; padding: 40px 20px; }
    .progress-bar-container {
      width: 100%;
      max-width: 400px;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin: 20px auto 10px;
    }
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.3s; }

    .result-state { display: none; flex-direction: column; align-items: center; gap: 20px; }
    .preview-box {
      position: relative;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
      margin: 0 auto;
    }
    .bg-checker {
      background-image: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%);
      background-size: 20px 20px;
    }
    .slider-img { display: block; width: 100%; height: auto; max-height: 480px; object-fit: contain; }
    .after-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }
    .range-slider {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: ew-resize; margin: 0; z-index: 10;
    }
    .slider-divider {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
      background: #fff; pointer-events: none;
    }
    .btn {
      background: var(--primary); color: #fff; font-weight: 600;
      padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer;
    }
    .btn-secondary { background: #334155; }
  </style>
</head>
<body>

  <header class="header">
    <div class="badge">In-Browser AI</div>
    <h1>Tách Nền Ảnh Trực Tiếp</h1>
    <p style="color: var(--text-sub); font-size: 0.95rem;">Không cần cài đặt, xử lý 100% trên máy của bạn.</p>
  </header>

  <main class="container">
    <div id="errorBanner" class="error-banner"></div>

    <label for="fileInput" class="upload-box" id="dropArea">
      <svg class="upload-icon" viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
      <h3>Nhấp vào đây hoặc Kéo thả ảnh vào</h3>
      <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 6px;">Hỗ trợ JPG, PNG, WEBP (hoặc Ctrl + V)</p>
      <div class="fake-btn">Chọn ảnh từ máy tính</div>
      <input type="file" id="fileInput" accept="image/*" style="position: absolute; left: -9999px;" />
    </label>

    <div class="loading-state" id="loadingState">
      <h3>Đang xử lý ảnh bằng AI...</h3>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p id="statusText" style="color: var(--text-sub); font-size: 0.85rem;">Đang kết nối mô hình...</p>
    </div>

    <div class="result-state" id="resultState">
      <div class="preview-box bg-checker" id="previewBox">
        <img id="beforeImg" class="slider-img" alt="Gốc" />
        <div class="after-wrapper" id="afterWrapper">
          <img id="afterImg" class="slider-img" alt="Tách nền" />
        </div>
        <input type="range" min="0" max="100" value="50" class="range-slider" id="sliderRange" />
        <div class="slider-divider" id="sliderDivider"></div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 10px;">
        <button class="btn" id="downloadBtn">Tải ảnh PNG (Trong suốt)</button>
        <button class="btn btn-secondary" onclick="location.reload()">Tách ảnh khác</button>
      </div>
    </div>
  </main>

  <script type="module">
    // Nạp thư viện an toàn: hỗ trợ cả Named Export và Default Export
    import * as imglyModule from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/+esm';
    const removeBackground = imglyModule.removeBackground || imglyModule.default;

    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const loadingState = document.getElementById('loadingState');
    const resultState = document.getElementById('resultState');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const beforeImg = document.getElementById('beforeImg');
    const afterImg = document.getElementById('afterImg');
    const sliderRange = document.getElementById('sliderRange');
    const afterWrapper = document.getElementById('afterWrapper');
    const sliderDivider = document.getElementById('sliderDivider');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorBanner = document.getElementById('errorBanner');

    let processedBlobUrl = null;

    function showError(msg) {
      errorBanner.innerText = msg;
      errorBanner.style.display = 'block';
      loadingState.style.display = 'none';
      dropArea.style.display = 'flex';
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) processFile(e.target.files[0]);
    });

    dropArea.addEventListener('dragover', (e) => e.preventDefault());
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
    });

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          processFile(item.getAsFile());
          break;
        }
      }
    });

    async function processFile(file) {
      if (!file.type.startsWith('image/')) {
        showError('Vui lòng chọn một file ảnh hợp lệ.');
        return;
      }

      errorBanner.style.display = 'none';
      dropArea.style.display = 'none';
      loadingState.style.display = 'block';
      progressBar.style.width = '10%';
      statusText.innerText = 'Đang đọc hình ảnh...';

      beforeImg.src = URL.createObjectURL(file);

      try {
        if (typeof removeBackground !== 'function') {
          throw new Error('Chưa tìm thấy hàm removeBackground trong gói thư viện!');
        }

        const blob = await removeBackground(file, {
          progress: (key, current, total) => {
            if (total > 0) {
              const pct = Math.round((current / total) * 100);
              progressBar.style.width = `${pct}%`;
              statusText.innerText = `Đang tải mô hình AI (${key.split(':')[0]}): ${pct}% (Lần đầu mất khoảng 20-30s)`;
            }
          }
        });

        if (processedBlobUrl) URL.revokeObjectURL(processedBlobUrl);
        processedBlobUrl = URL.createObjectURL(blob);
        afterImg.src = processedBlobUrl;

        loadingState.style.display = 'none';
        resultState.style.display = 'flex';
      } catch (err) {
        console.error(err);
        showError('Lỗi trong quá trình xử lý: ' + err.message);
      }
    }

    sliderRange.addEventListener('input', (e) => {
      const val = e.target.value;
      afterWrapper.style.clipPath = `polygon(0 0, ${val}% 0, ${val}% 100%, 0 100%)`;
      sliderDivider.style.left = `${val}%`;
    });

    downloadBtn.addEventListener('click', () => {
      if (!processedBlobUrl) return;
      const a = document.createElement('a');
      a.href = processedBlobUrl;
      a.download = `da-tach-nen-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
